name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflows only need to read the source. Explicitly
# requesting the minimum cuts the blast radius of a compromised action
# (GitHub falls back to the repository-wide default token policy otherwise).
permissions:
  contents: read

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyright bandit

      - name: Run Ruff (linter)
        run: ruff check limpiapro/ tests/

      - name: Run Ruff (formatter check)
        run: ruff format --check limpiapro/services/ limpiapro/contracts.py tests/test_destructive_paths.py tests/test_paths.py tests/test_services.py tests/test_startup_registry.py

      - name: Run Pyright (type checker)
        run: pyright limpiapro/

      - name: Run Bandit (security scanner)
        run: bandit -r limpiapro/ -c pyproject.toml -f json -o bandit-report.json

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  test:
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            .pytest_cache/
            *.log

  build:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Build executable with PyInstaller
        run: python -m PyInstaller --noconfirm LimpiaPro.spec

      - name: Verify executable exists
        run: |
          if (-not (Test-Path "dist/LimpiaPro.exe")) {
            Write-Error "Executable not generated"
            exit 1
          }
          Write-Host "✓ Executable built successfully"
          Get-Item "dist/LimpiaPro.exe" | Select-Object Name, Length, LastWriteTime

      - name: Smoke test executable
        run: |
          dist\LimpiaPro.exe --smoke-test

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $exe = "dist/LimpiaPro.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash
          "$hash  LimpiaPro.exe" | Out-File -Encoding ascii "$exe.sha256"
          Write-Host "SHA256: $hash"
          Get-Content "$exe.sha256"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: LimpiaPro-${{ github.sha }}
          path: |
            dist/LimpiaPro.exe
            dist/LimpiaPro.exe.sha256
          retention-days: 7
