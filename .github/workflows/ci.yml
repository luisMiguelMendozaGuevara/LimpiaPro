name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflows only need to read the source. Explicitly
# requesting the minimum cuts the blast radius of a compromised action
# (GitHub falls back to the repository-wide default token policy otherwise).
permissions:
  contents: read

jobs:
  lint:
    runs-on: windows-latest
    steps:
      # Actions are pinned by full commit SHA (Lote D1): a mutable tag
      # (@v4) lets a compromised upstream repo run code in CI. Bump =
      # update SHA + version comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        # Pyright type-checks the application, so it needs the RUNTIME
        # dependencies as well: without PySide6 every `import PySide6.*`
        # is a reportMissingImports error (reportMissingImports is on).
        # The dev tools must come from the exact pins of
        # requirements-dev.txt: a floating install already broke the
        # Bandit gate once (1.7 -> 1.9), which is asserted by
        # test_security_hardening.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run Ruff (linter)
        run: ruff check limpiapro/ tests/

      - name: Run Ruff (formatter check)
        run: ruff format --check limpiapro/services/ limpiapro/contracts.py tests/test_destructive_paths.py tests/test_paths.py tests/test_services.py tests/test_startup_registry.py

      - name: Run Pyright (type checker)
        run: pyright limpiapro/

      - name: Run Bandit (security scanner)
        run: bandit -r limpiapro/ -c pyproject.toml -f json -o bandit-report.json

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bandit-report
          path: bandit-report.json

  test:
    runs-on: windows-latest
    needs: lint
    strategy:
      # One red Python version must not hide the results of the others.
      fail-fast: false
      matrix:
        # requires-python promises >=3.10, so 3.10/3.11 MUST be exercised:
        # before Lote E1.1 (is_junction shim) they would crash on import of
        # the delete/scan core (os.path.isjunction is 3.12+). The full pin
        # set supports 3.10-3.14 (PySide6 6.11.2 classifiers).
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      # Actions are pinned by full commit SHA (Lote D1): a mutable tag
      # (@v4) lets a compromised upstream repo run code in CI. Bump =
      # update SHA + version comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: |
            .pytest_cache/
            *.log

  build:
    runs-on: windows-latest
    needs: test
    steps:
      # Actions are pinned by full commit SHA (Lote D1): a mutable tag
      # (@v4) lets a compromised upstream repo run code in CI. Bump =
      # update SHA + version comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Build executable with PyInstaller
        run: python -m PyInstaller --noconfirm LimpiaPro.spec

      - name: Verify executable exists
        run: |
          if (-not (Test-Path "dist/LimpiaPro.exe")) {
            Write-Error "Executable not generated"
            exit 1
          }
          Write-Host "✓ Executable built successfully"
          Get-Item "dist/LimpiaPro.exe" | Select-Object Name, Length, LastWriteTime

      - name: Smoke test executable
        run: |
          dist\LimpiaPro.exe --smoke-test

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $exe = "dist/LimpiaPro.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash
          "$hash  LimpiaPro.exe" | Out-File -Encoding ascii "$exe.sha256"
          Write-Host "SHA256: $hash"
          Get-Content "$exe.sha256"

      - name: Upload executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: LimpiaPro-${{ github.sha }}
          path: |
            dist/LimpiaPro.exe
            dist/LimpiaPro.exe.sha256
          retention-days: 7
