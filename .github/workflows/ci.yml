name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyright bandit

      - name: Run Ruff (linter)
        run: ruff check limpiapro/ tests/

      - name: Run Ruff (formatter check)
        run: ruff format --check limpiapro/ tests/

      - name: Run Pyright (type checker)
        run: pyright limpiapro/
        continue-on-error: true  # Allow type errors for now, track them

      - name: Run Bandit (security scanner)
        run: bandit -r limpiapro/ -c pyproject.toml -f json -o bandit-report.json
        continue-on-error: true

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  test:
    runs-on: windows-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            .pytest_cache/
            *.log

  build:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Build executable with PyInstaller
        run: python -m PyInstaller --noconfirm LimpiaPro.spec

      - name: Verify executable exists
        run: |
          if (-not (Test-Path "dist/LimpiaPro.exe")) {
            Write-Error "Executable not generated"
            exit 1
          }
          Write-Host "✓ Executable built successfully"
          Get-Item "dist/LimpiaPro.exe" | Select-Object Name, Length, LastWriteTime

      - name: Smoke test executable
        run: |
          Write-Host "Running smoke test..."
          $process = Start-Process -FilePath "dist/LimpiaPro.exe" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 5
          
          if ($process.HasExited) {
            Write-Error "Application crashed on startup (exit code: $($process.ExitCode))"
            exit 1
          }
          
          Stop-Process -Id $process.Id -Force
          Write-Host "✓ Smoke test passed"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: LimpiaPro-${{ github.sha }}
          path: dist/LimpiaPro.exe
          retention-days: 7
